# cp inventory.example.yml inventory.yml puis remplir. inventory.yml est gitignoré.
#
# Installation par défaut : UN hôte. Voir docs/adr.md 0008 — séparer le proxy
# du serveur de jeu sur deux fournisseurs ajoute de la latence et un point de
# panne sans rien économiser.
all:
  children:
    arm:
      hosts:
        core: { ansible_host: 203.0.113.10, ansible_user: opc }

    # Optionnel : seulement si le jeu tourne sur Oracle et qu'on veut garder
    # l'IP de la VM hors de la vue publique. Inutile sur un VPS unique.
    edge:
      hosts: {}
