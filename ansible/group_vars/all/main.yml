github_org: caffelatte
svc_uid: 1001
# Pilote systemd --user de l'utilisateur svc depuis une tâche root.
svc_systemctl: >-
  runuser -u svc -- env XDG_RUNTIME_DIR=/run/user/{{ svc_uid }} systemctl --user

minecraft_version: "1.21.8"   # bumper ici : l'image se rebuild, les joueurs sont avertis
# 5-10 joueurs : 4 Go de tas est large. Plus gros ne va PAS plus vite — ça
# allonge seulement les pauses GC. La RAM n'est pas le goulot ici, le CPU l'est.
minecraft_heap: "4G"
# simulation-distance est le vrai levier CPU (entités, redstone, aléatoire de
# blocs : coût en cube du rayon). view-distance ne fait qu'envoyer des chunks.
minecraft_view_distance: 10
minecraft_simulation_distance: 6
# Rayon pré-généré par Chunky. Au-delà, le joueur attend la génération —
# c'est ce qui fait chuter le TPS sur 2 OCPU.
minecraft_border_radius: 5000
maintenance_warn_minutes: [15, 5, 1]
