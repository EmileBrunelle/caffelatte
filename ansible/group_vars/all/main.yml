github_org: caffelatte
svc_uid: 1001
# Pilote systemd --user de l'utilisateur svc depuis une tâche root.
svc_systemctl: >-
  runuser -u svc -- env XDG_RUNTIME_DIR=/run/user/{{ svc_uid }} systemctl --user
# Même chose pour podman : les conteneurs sont rootless, ils n'existent que
# dans le stockage de svc. Un « podman » lancé en root ne verrait rien.
svc_podman: >-
  runuser -u svc -- env XDG_RUNTIME_DIR=/run/user/{{ svc_uid }} podman

minecraft_version: "1.21.8"   # bumper ici : l'image se rebuild, les joueurs sont avertis
# 5-10 joueurs : 4 Go de tas est large. Plus gros ne va PAS plus vite — ça
# allonge seulement les pauses GC. La RAM n'est pas le goulot ici, le CPU l'est.
minecraft_heap: "4G"
# simulation-distance est le vrai levier CPU (entités, redstone, aléatoire de
# blocs : coût en cube du rayon). view-distance ne fait qu'envoyer des chunks.
minecraft_view_distance: 10
minecraft_simulation_distance: 6
# Rayon pré-généré par Chunky. Au-delà, le joueur attend la génération —
# c'est ce qui fait chuter le TPS sur 2 OCPU.
minecraft_border_radius: 5000
# Plafond d'attente de mc-maintenance.sh entre le signal envoyé à Gate et le
# fichier témoin qui confirme que les joueurs sont sortis. Doit dépasser le
# préavis le plus long de Gate (maintenance.Warnings, 5 min) avec de la marge.
# Passé ce délai le script ABANDONNE la mise à jour plutôt que de déconnecter
# des joueurs qu'on venait de promettre de prévenir.
#
# Les paliers d'avertissement eux-mêmes ne sont PAS ici : ils vivent dans
# maintenance.Warnings côté Go, seul endroit qui les applique. Une variable
# Ansible que personne ne lit ne ferait que mentir au prochain lecteur.
maintenance_attente_max_secondes: 480

# Mise en veille du serveur quand il est vide. Gate garde le port, démarre le
# backend à la première connexion, l'arrête après N minutes sans joueur.
#
# ATTENTION — à laisser à false sur un compte Oracle Always Free. Oracle
# récupère les instances INACTIVES : CPU p95 < 20 % ET réseau < 20 % ET mémoire
# < 20 % sur 7 jours (mémoire pour les formes A1 seulement). Un `-Xms4G` sur
# 12 Go réserve 33 % en permanence — le serveur qui tourne à vide est ce qui
# empêche la récupération. L'éteindre la provoque.
#
# Sur un VPS payé, la récupération n'existe pas : passer à true est un gain net
# (2 vCPU libérés pour le reste quand personne ne joue).
# À l'année sur Oracle Always Free : DOIT rester false. Le serveur qui tourne
# à vide avec 4 Go réservés est ce qui empêche la récupération pour inactivité.
minecraft_sleep_when_empty: false
minecraft_sleep_after_minutes: 20

# Liste d'autorisation du serveur. Elle vit DANS Gate, pas dans le backend :
# le backend n'a pas d'accès sortant et ne peut donc pas résoudre un pseudo
# auprès de Mojang (voir gate.yml.j2 et containers/minecraft/entrypoint.sh).
# Un parrain tape « /invite <pseudo> » en jeu ; Gate résout le pseudo en UUID
# chez Mojang et l'inscrit dans /var/lib/gate/invitations.json (volume gate-data).
# Les parrains sont autorisés d'office, sans figurer dans le fichier.
#
# L'autorisation se fait par UUID, JAMAIS par pseudo : un pseudo se change, un
# UUID non — et Gate est en onlineMode, donc l'UUID est authentifié.
# Récupérer le sien : https://api.mojang.com/users/profiles/minecraft/<pseudo>
#
# ATTENTION : la liste vide fait échouer le démarrage de Gate, délibérément.
# Sans parrain, personne ne peut inviter et personne ne peut entrer ; mieux vaut
# un proxy qui refuse de démarrer qu'un serveur ouvert qu'on croit fermé.
minecraft_parrains: []
# Sous-ensemble des parrains autorisé à révoquer n'importe quelle invitation
# (/uninvite), pas seulement la sienne. Sans administrateur, les invités d'un
# parrain qu'on sort de minecraft_parrains restent autorisés sans que personne
# ne puisse les retirer — ils ne sont PAS éjectés automatiquement, c'est
# délibéré : retirer un parrain ne doit pas déconnecter ses amis par surprise.
minecraft_admins: []
# Plafond par parrain, pour borner les dégâts d'un compte compromis. Persisté :
# il se déduit du nombre d'entrées du fichier, il tient donc au redémarrage.
minecraft_plafond_invitations: 5
