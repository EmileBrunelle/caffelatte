github_org: caffelatte
svc_uid: 1001
# Pilote systemd --user de l'utilisateur svc depuis une tâche root.
svc_systemctl: >-
  runuser -u svc -- env XDG_RUNTIME_DIR=/run/user/{{ svc_uid }} systemctl --user

minecraft_version: "1.21.8"   # bumper ici : l'image se rebuild, les joueurs sont avertis
# 5-10 joueurs : 4 Go de tas est large. Plus gros ne va PAS plus vite — ça
# allonge seulement les pauses GC. La RAM n'est pas le goulot ici, le CPU l'est.
minecraft_heap: "4G"
# simulation-distance est le vrai levier CPU (entités, redstone, aléatoire de
# blocs : coût en cube du rayon). view-distance ne fait qu'envoyer des chunks.
minecraft_view_distance: 10
minecraft_simulation_distance: 6
# Rayon pré-généré par Chunky. Au-delà, le joueur attend la génération —
# c'est ce qui fait chuter le TPS sur 2 OCPU.
minecraft_border_radius: 5000
maintenance_warn_minutes: [15, 5, 1]

# Mise en veille du serveur quand il est vide. Gate garde le port, démarre le
# backend à la première connexion, l'arrête après N minutes sans joueur.
#
# ATTENTION — à laisser à false sur un compte Oracle Always Free. Oracle
# récupère les instances INACTIVES : CPU p95 < 20 % ET réseau < 20 % ET mémoire
# < 20 % sur 7 jours (mémoire pour les formes A1 seulement). Un `-Xms4G` sur
# 12 Go réserve 33 % en permanence — le serveur qui tourne à vide est ce qui
# empêche la récupération. L'éteindre la provoque.
#
# Sur un VPS payé, la récupération n'existe pas : passer à true est un gain net
# (2 vCPU libérés pour le reste quand personne ne joue).
# À l'année sur Oracle Always Free : DOIT rester false. Le serveur qui tourne
# à vide avec 4 Go réservés est ce qui empêche la récupération pour inactivité.
minecraft_sleep_when_empty: false
minecraft_sleep_after_minutes: 20
