# Déploie la pile de jeu. Ne suppose RIEN de l'hébergeur : n'importe quel hôte
# Enterprise Linux avec Podman fait l'affaire. C'est ce qui rend le choix du
# fournisseur réversible en une soirée.
- name: Secrets vers podman secret (tmpfs, jamais en variable d'environnement)
  ansible.builtin.command:
    cmd: "podman secret create --replace {{ item.name }} -"
    stdin: "{{ item.value }}"
  become: true
  become_user: svc
  loop:
    - { name: rcon_password, value: "{{ rcon_password }}" }
    - { name: forwarding_secret, value: "{{ forwarding_secret }}" }
    - { name: floodgate_key, value: "{{ floodgate_key }}" }
  no_log: true
  changed_when: true

- name: Système de fichiers du disque de données déjà présent ?
  # blkid ne renvoie rien sur un disque vierge : c'est notre seul signal pour
  # savoir s'il faut formater. Ne JAMAIS reformater un disque qui porte déjà
  # un système de fichiers — c'est le monde des joueurs.
  ansible.builtin.command: "blkid -o value -s TYPE {{ minecraft_data_device }}"
  register: minecraft_data_blkid
  changed_when: false
  failed_when: false

- name: Formater le disque de données en xfs (une seule fois, disque vierge)
  ansible.builtin.command: "mkfs.xfs {{ minecraft_data_device }}"
  when: minecraft_data_blkid.stdout == ""
  changed_when: true

- name: Point de montage du disque de données
  ansible.builtin.file:
    path: "{{ minecraft_data_path }}"
    state: directory
    mode: "0755"

- name: Monter le disque de données
  # nofail : un disque absent au boot ne doit pas bloquer le démarrage, sinon
  # le seul recours pour reprendre la main est la console série OCI.
  ansible.posix.mount:
    path: "{{ minecraft_data_path }}"
    src: "{{ minecraft_data_device }}"
    fstype: xfs
    opts: nofail
    state: mounted

- name: Propriété du répertoire de données pour le conteneur rootless
  # Le montage se fait en root (tâche privilégiée) mais podman tourne en
  # rootless sous svc : sans ce chown, le conteneur ne peut pas écrire dans
  # /data malgré le :Z sur le bind mount.
  ansible.builtin.file:
    path: "{{ minecraft_data_path }}"
    owner: svc
    group: svc

- name: Volumes d'état
  # gate-data reste un volume podman nommé : Gate est le conteneur exposé à
  # Internet, il n'a rien à écrire dans les données du monde, et sa liste
  # d'invitations n'a pas besoin de survivre seule à la perte de l'instance.
  # minecraft-data, lui, est maintenant un bind mount sur le disque de
  # données (voir plus haut) et ne passe plus par ici.
  ansible.builtin.command: "podman volume exists {{ item }} || podman volume create {{ item }}"
  become: true
  become_user: svc
  loop: [gate-data]
  changed_when: false

- name: Config Gate
  ansible.builtin.template:
    src: gate.yml.j2
    dest: /home/svc/.config/gate/config.yml
    owner: svc
    mode: "0640"
  # Gate surveille ce fichier et recharge à chaud : pas de notify, pas de
  # redémarrage, personne n'est déconnecté.

- name: Répertoire du témoin de maintenance
  # Gate (rootless, uid svc) y écrit ; le script de mise à jour, lui, tourne en
  # root et se contente de lire.
  ansible.builtin.file:
    path: /home/svc/maintenance
    state: directory
    owner: svc
    group: svc
    mode: "0755"

- name: Script de maintenance encadrant les mises à jour
  ansible.builtin.template:
    src: mc-maintenance.sh.j2
    dest: /usr/local/sbin/mc-maintenance.sh
    owner: root
    mode: "0750"

- name: Unités de mise à jour encadrée
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    mode: "0644"
  loop: [mc-update.service, mc-update.timer]

- name: Désactiver l'auto-update podman natif sur l'hôte de jeu
  # Unité UTILISATEUR, activée par le rôle base : elle tire les images et
  # redémarre les conteneurs SANS préavis, court-circuitant exactement la
  # fenêtre de maintenance. L'hôte edge la garde, il n'a pas de joueurs à
  # ménager. Pilotée par runuser comme les autres unités de svc.
  ansible.builtin.command: "{{ svc_systemctl }} disable --now podman-auto-update.timer"
  changed_when: false

- name: Activer la mise à jour encadrée
  ansible.builtin.systemd_service:
    name: mc-update.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Config Geyser
  ansible.builtin.template:
    src: geyser.yml.j2
    dest: /home/svc/.config/geyser/config.yml
    owner: svc
    mode: "0640"
  notify: Reload user systemd

- name: Unités Quadlet
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "/home/svc/.config/containers/systemd/{{ item }}"
    owner: svc
    mode: "0644"
  loop: [mc.network, minecraft.container, gate.container, geyser.container]
  notify: Reload user systemd

- name: Démarrer
  ansible.builtin.command: "{{ svc_systemctl }} enable --now {{ item }}"
  loop: [minecraft.service, gate.service, geyser.service]
  changed_when: false
