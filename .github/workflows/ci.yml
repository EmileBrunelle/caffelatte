name: ci
on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - run: pipx install ansible-lint && ansible-lint ansible/
      - name: Aucun secret en clair, aucune adresse d'hôte
        run: |
          # 127.0.0.1 et 0.0.0.0 ne désignent aucun hôte : les exclure, sinon le
          # garde-fou se déclenche sur la doc de `ansible-pull` (inventory-pull.yml).
          ! grep -rEn '([0-9]{1,3}\.){3}[0-9]{1,3}' ansible/ --include='*.yml' \
              --exclude='*.example.yml' \
            | grep -vE '\b(127\.0\.0\.1|0\.0\.0\.0)\b' \
            || { echo "adresse IP dans le dépôt public"; exit 1; }

  image:
    runs-on: ubuntu-24.04-arm
    permissions: { contents: read, packages: write, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - run: podman build -t minecraft containers/minecraft

      # Trivy (via docker/containerd/podman API) ne voit pas les images
      # podman du runner : on exporte en tar pour scanner sans socket.
      - run: podman save -o minecraft.tar minecraft

      # On construit sa propre image : on hérite donc de la responsabilité de
      # savoir ce qu'il y a dedans. Échec sur CVE haute ou critique corrigeable.
      - uses: aquasecurity/trivy-action@master
        with:
          input: minecraft.tar
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  opentofu:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
      - run: tofu -chdir=terraform fmt -check
      - run: tofu -chdir=terraform init -backend=false && tofu -chdir=terraform validate
      # Checkov, pas tfsec : voir .checkov.yaml. tfsec n'a aucune règle OCI et
      # n'a donc jamais rien pu détecter ici. Installé par pipx comme
      # ansible-lint plus haut, ce qui évite une action tierce de plus — c'est
      # justement l'appel à l'API GitHub de tfsec-action qui échouait par
      # intermittence. La configuration, dont les exemptions, vit dans
      # .checkov.yaml pour être lisible hors du workflow.
      - run: pipx install checkov && checkov --config-file .checkov.yaml --compact
